<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" class="euclid-graphic" data-graphic-id="menelaus-planar-parallel">
  <style>
.euclid-graphic {
    --svg-bg: #fafaf9;
    --ink: #1c1917;
    --label-halo: rgba(250, 250, 249, 0.92);
    --given: #334155;
    --aux: #0284c7;
    --cevian: #059669;
    --transversal: #d97706;
    --limb: #64748b;
    --pt-given: #0f172a;
    --pt-trace: #d97706;
    --pt-cevian: #059669;
    --pt-aux: #0284c7;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic {
      --svg-bg: #141417;
      --ink: #f4f4f5;
      --label-halo: rgba(20, 20, 23, 0.92);
      --given: #cbd5e1;
      --aux: #38bdf8;
      --cevian: #34d399;
      --transversal: #fbbf24;
      --limb: #94a3b8;
      --pt-given: #f1f5f9;
      --pt-trace: #fbbf24;
      --pt-cevian: #34d399;
      --pt-aux: #38bdf8;
    }
  }
  .euclid-graphic .bg { fill: var(--svg-bg); }
  .euclid-graphic .geom-line { fill: none; stroke: var(--given); stroke-width: 1.75; stroke-linecap: round; }
  .euclid-graphic .geom-line.auxiliary, .euclid-graphic .geom-line.bisector { stroke: var(--aux); stroke-width: 1.45; stroke-dasharray: 6 4; opacity: 0.88; }
  .euclid-graphic .geom-line.cevian { stroke: var(--cevian); stroke-width: 1.65; stroke-dasharray: 4 3; }
  .euclid-graphic .geom-line.transversal, .euclid-graphic .geom-line.result { stroke: var(--transversal); stroke-width: 2.65; stroke-dasharray: none; }
  .euclid-graphic .geom-line.back-arc { stroke-dasharray: 3.5 4.5; opacity: 0.42; }
  .euclid-graphic .geom-segment { fill: none; stroke: var(--aux); stroke-width: 2.2; stroke-linecap: round; }
  .euclid-graphic .geom-segment.extension { stroke: var(--given); stroke-dasharray: 5 3.5; stroke-width: 1.6; }
  .euclid-graphic .geom-circle { fill: none; stroke: var(--given); stroke-width: 1.85; opacity: 0.88; }
  .euclid-graphic .geom-circle.sphere-limb { stroke: var(--limb); stroke-width: 2.2; fill: var(--aux); fill-opacity: 0.04; }
  .euclid-graphic .geom-polygon { fill: var(--aux); fill-opacity: 0.06; stroke: var(--given); stroke-width: 2.1; stroke-linejoin: round; }
  .euclid-graphic .geom-polygon.cevian { fill: var(--cevian); fill-opacity: 0.07; stroke: var(--cevian); stroke-width: 1.6; }
  .euclid-graphic .geom-point { fill: var(--pt-given); stroke: var(--svg-bg); stroke-width: 1.5; }
  .euclid-graphic .geom-point.trace, .euclid-graphic .geom-point.result { fill: var(--pt-trace); stroke-width: 1.8; }
  .euclid-graphic .geom-point.cevian { fill: var(--pt-cevian); }
  .euclid-graphic .geom-point.auxiliary, .euclid-graphic .geom-point.center { fill: var(--pt-aux); }
  .euclid-graphic .geom-label {
    fill: var(--ink);
    font-size: 14px;
    font-weight: 600;
    paint-order: stroke fill;
    stroke: var(--label-halo);
    stroke-width: 3.6px;
    stroke-linejoin: round;
    user-select: none;
  }
  .euclid-graphic .geom-label-sub { font-size: 10.5px; font-weight: 600; }
  </style>
  <defs>
    <path id="geom-tick-1" d="M 0,-5.5 L 0,5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path id="geom-tick-2" d="M -2.4,-5.5 L -2.4,5.5 M 2.4,-5.5 L 2.4,5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path id="geom-tick-3" d="M -4.2,-5.5 L -4.2,5.5 M 0,-5.5 L 0,5.5 M 4.2,-5.5 L 4.2,5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <g id="elements">
    <g id="graphics">
      <polygon class="geom-polygon" points="248.55,128.55 117.1,391.45 511.45,391.45" data-ref="&lt; A B C &gt;"/>
      <path class="geom-line auxiliary" d="M 54 208.47 L 322.16 315.74 L 590.32 423" data-ref="[ C Cpar ]" data-aliases="[ C H ] | [ H C ] | / C H / | / H C /"/>
      <path class="geom-line given" d="M 54 391.45 L 380 391.45 L 706 391.45" data-ref="[ B C ]" data-aliases="[ C B ] | / B C / | / C B / | [ B D ] | [ D B ] | / B D / | / D B / | [ C D ] | [ D C ] | / C D / | / D C /"/>
      <path class="geom-line given" d="M 543 423 L 380 260 L 217 97" data-ref="[ C A ]" data-aliases="[ A C ] | / A C / | / C A / | [ A E ] | [ E A ] | / A E / | / E A / | [ C E ] | [ E C ] | / C E / | / E C /"/>
      <path class="geom-line given" d="M 101.32 423 L 182.82 260 L 264.32 97" data-ref="[ A B ]" data-aliases="[ B A ] | / A B / | / B A / | [ A F ] | [ F A ] | / A F / | / F A / | [ A H ] | [ H A ] | / A H / | / H A / | [ B F ] | [ F B ] | / B F / | / F B / | [ B H ] | [ H B ] | / B H / | / H B / | [ F H ] | [ H F ] | / F H / | / H F /"/>
      <path class="geom-line transversal result" d="M 54 155.89 L 380 286.29 L 706 416.69" data-ref="[ D F ]" data-aliases="[ F D ] | / D F / | / F D / | [ D E ] | [ E D ] | / D E / | / E D / | [ F E ] | [ E F ] | / F E / | / E F /"/>
      <path class="geom-segment auxiliary" d="M 511.45 391.45 L 347.14 325.73 L 182.82 260" data-ref="/ C H /"/>
      <path class="geom-segment extension" d="M 511.45 391.45 L 577.18 391.45 L 642.9 391.45" data-ref="/ C D /"/>
    </g>
    <g id="highlights" aria-hidden="true">
      <polygon class="geom-polygon geom-highlight" points="248.55,128.55 117.1,391.45 511.45,391.45" data-ref="&lt; A B C &gt;"/>
      <path class="geom-line geom-highlight" d="M 54 208.47 L 322.16 315.74 L 590.32 423" data-ref="[ C Cpar ]" data-aliases="[ C H ] | [ H C ] | / C H / | / H C /"/>
      <path class="geom-line geom-highlight" d="M 54 391.45 L 380 391.45 L 706 391.45" data-ref="[ B C ]" data-aliases="[ C B ] | / B C / | / C B / | [ B D ] | [ D B ] | / B D / | / D B / | [ C D ] | [ D C ] | / C D / | / D C /"/>
      <path class="geom-line geom-highlight" d="M 543 423 L 380 260 L 217 97" data-ref="[ C A ]" data-aliases="[ A C ] | / A C / | / C A / | [ A E ] | [ E A ] | / A E / | / E A / | [ C E ] | [ E C ] | / C E / | / E C /"/>
      <path class="geom-line geom-highlight" d="M 101.32 423 L 182.82 260 L 264.32 97" data-ref="[ A B ]" data-aliases="[ B A ] | / A B / | / B A / | [ A F ] | [ F A ] | / A F / | / F A / | [ A H ] | [ H A ] | / A H / | / H A / | [ B F ] | [ F B ] | / B F / | / F B / | [ B H ] | [ H B ] | / B H / | / H B / | [ F H ] | [ H F ] | / F H / | / H F /"/>
      <path class="geom-line geom-highlight" d="M 54 155.89 L 380 286.29 L 706 416.69" data-ref="[ D F ]" data-aliases="[ F D ] | / D F / | / F D / | [ D E ] | [ E D ] | / D E / | / E D / | [ F E ] | [ E F ] | / F E / | / E F /"/>
      <path class="geom-segment geom-highlight" d="M 511.45 391.45 L 347.14 325.73 L 182.82 260" data-ref="/ C H /"/>
      <path class="geom-segment geom-highlight" d="M 511.45 391.45 L 577.18 391.45 L 642.9 391.45" data-ref="/ C D /"/>
    </g>
    <g id="points">
      <circle class="geom-point given" cx="248.55" cy="128.55" r="3.9" data-ref="A"><title>A = (3, 6)</title></circle>
      <circle class="geom-point given" cx="117.1" cy="391.45" r="3.9" data-ref="B"><title>B = (0, 0)</title></circle>
      <circle class="geom-point given" cx="511.45" cy="391.45" r="3.9" data-ref="C"><title>C = (9, 0)</title></circle>
      <circle class="geom-point given trace result" cx="642.9" cy="391.45" r="4.6" data-ref="D"><title>D = (12, 0)</title></circle>
      <circle class="geom-point given trace result" cx="204.73" cy="216.18" r="4.6" data-ref="F"><title>F = (2, 4)</title></circle>
      <circle class="geom-point trace result" cx="423.82" cy="303.82" r="4.6" data-ref="E"><title>E = (7, 2)</title></circle>
      <circle class="geom-point auxiliary" cx="182.82" cy="260" r="3.9" data-ref="H"><title>H = (3/2, 3)</title></circle>
    </g>
    <g id="labels">
