      <path class="geom-line geom-highlight" d="M 91.6 404.33 L 310.56 229.17 L 529.52 54" data-ref="[ Sbc Sca ]" data-aliases="[ Sca Sbc ] | / Sbc Sca / | / Sca Sbc / | [ Sbc Sab ] | [ Sab Sbc ] | / Sbc Sab / | / Sab Sbc / | [ Sca Sab ] | [ Sab Sca ] | / Sca Sab / | / Sab Sca /"/>
