      <path class="geom-line given" d="M 100.27 433.87 L 187.2 260 L 274.14 86.13" data-ref="[ A B ]" data-aliases="[ B A ] | / A B / | / B A / | [ A F ] | [ F A ] | / A F / | / F A / | [ A H ] | [ H A ] | / A H / | / H A / | [ B F ] | [ F B ] | / B F / | / F B / | [ B H ] | [ H B ] | / B H / | / H B / | [ F H ] | [ H F ] | / F H / | / H F /"/>
      <path class="geom-line transversal result" d="M 54 219.01 L 380 319.32 L 706 419.63" data-ref="[ D F ]" data-aliases="[ F D ] | / D F / | / F D / | [ D E ] | [ E D ] | / D E / | / E D / | [ F E ] | [ E F ] | / F E / | / E F /"/>
      <path class="geom-segment auxiliary" d="M 467.63 400.22 L 315.73 353.48 L 163.84 306.74" data-ref="/ C H /"/>
      <path class="geom-segment extension" d="M 467.63 400.22 L 555.27 400.22 L 642.9 400.22" data-ref="/ C D /"/>
    </g>
    <g id="highlights" aria-hidden="true">
      <polygon class="geom-polygon geom-highlight" points="257.31,119.78 117.1,400.22 467.63,400.22" data-ref="&lt; A B C &gt;"/>
      <path class="geom-line geom-highlight" d="M 54 272.94 L 315.5 353.4 L 577 433.87" data-ref="[ C Cpar ]" data-aliases="[ C H ] | [ H C ] | / C H / | / H C /"/>
      <path class="geom-line geom-highlight" d="M 54 400.22 L 380 400.22 L 706 400.22" data-ref="[ B C ]" data-aliases="[ C B ] | / B C / | / C B / | [ B D ] | [ D B ] | / B D / | / D B / | [ C D ] | [ D C ] | / C D / | / D C /"/>
      <path class="geom-line geom-highlight" d="M 492.87 433.87 L 362.47 260 L 232.07 86.13" data-ref="[ C A ]" data-aliases="[ A C ] | / A C / | / C A / | [ A E ] | [ E A ] | / A E / | / E A / | [ C E ] | [ E C ] | / C E / | / E C /"/>
      <path class="geom-line geom-highlight" d="M 100.27 433.87 L 187.2 260 L 274.14 86.13" data-ref="[ A B ]" data-aliases="[ B A ] | / A B / | / B A / | [ A F ] | [ F A ] | / A F / | / F A / | [ A H ] | [ H A ] | / A H / | / H A / | [ B F ] | [ F B ] | / B F / | / F B / | [ B H ] | [ H B ] | / B H / | / H B / | [ F H ] | [ H F ] | / F H / | / H F /"/>
      <path class="geom-line geom-highlight" d="M 54 219.01 L 380 319.32 L 706 419.63" data-ref="[ D F ]" data-aliases="[ F D ] | / D F / | / F D / | [ D E ] | [ E D ] | / D E / | / E D / | [ F E ] | [ E F ] | / F E / | / E F /"/>
      <path class="geom-segment geom-highlight" d="M 467.63 400.22 L 315.73 353.48 L 163.84 306.74" data-ref="/ C H /"/>
      <path class="geom-segment geom-highlight" d="M 467.63 400.22 L 555.27 400.22 L 642.9 400.22" data-ref="/ C D /"/>
    </g>
    <g id="points">
      <circle class="geom-point given" cx="257.31" cy="119.78" r="3.9" data-ref="A"><title>A = (4, 8)</title></circle>
      <circle class="geom-point given" cx="117.1" cy="400.22" r="3.9" data-ref="B"><title>B = (0, 0)</title></circle>
      <circle class="geom-point given" cx="467.63" cy="400.22" r="3.9" data-ref="C"><title>C = (10, 0)</title></circle>
      <circle class="geom-point given trace result" cx="642.9" cy="400.22" r="4.6" data-ref="D"><title>D = (15, 0)</title></circle>
      <circle class="geom-point given trace result" cx="187.2" cy="260" r="4.6" data-ref="F"><title>F = (2, 4)</title></circle>
      <circle class="geom-point trace result" cx="415.05" cy="330.11" r="4.6" data-ref="E"><title>E = (17/2, 2)</title></circle>
      <circle class="geom-point auxiliary" cx="163.84" cy="306.74" r="3.9" data-ref="H"><title>H = (4/3, 8/3)</title></circle>
    </g>
